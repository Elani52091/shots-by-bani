<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Photography Enquiries | Shots by Bugs</title>

    <meta name="description" content="Make an enquiry about photography services, availability and pricing at Shots by Bugs Photography.">

    <meta name="keywords" content="photography enquiry, photography prices, photographer availability, Shots by Bugs">

    <meta name="author" content="Shots by Bugs Photography">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Shots by Bugs Photography</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="services.html">Services</a>
            <a href="gallery.html">Gallery</a>
            <a href="booking.html">Booking</a>
            <a href="enquiry.html">Enquiry</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Make an Enquiry</h2>

            <p>
                Would you like to know more about our photography services?
                Complete the form below and tell us what you need.
            </p>

            <form id="enquiryForm">

                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>

                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" required>

                <label for="service">Photography Service:</label>
                <select id="service" name="service" required>
                    <option value="">Select a service</option>
                    <option value="Graduation Photography">Graduation Photography</option>
                    <option value="Birthday Photography">Birthday Photography</option>
                    <option value="Family Portraits">Family Portraits</option>
                    <option value="Special Events">Special Events</option>
                    <option value="Small Business Photography">Small Business Photography</option>
                </select>

                <label for="date">Preferred Date:</label>
                <input type="date" id="date" name="date" required>

                <label for="message">Tell us more about your enquiry:</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <button type="submit">Submit Enquiry</button>

                <p id="formMessage" aria-live="polite"></p>

            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Shots by Bugs Photography. All rights reserved.</p>
    </footer>

    <script src="js/script.js"></script>

</body>
</html>
